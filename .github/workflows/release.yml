name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: macos-14
    permissions:
      id-token: write   # required for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          TRANSCRIBE_SKIP_POSTINSTALL: "1"
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      # Note: no separate `bun publish --dry-run` step. bun's dry-run
      # requires auth in CI (returns exit 1 without it), and the real
      # publish below does identical packing — a packing failure would
      # surface there. Local pre-tag dry-runs are recommended in
      # CONTRIBUTING.md.
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
